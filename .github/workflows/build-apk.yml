name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar frontend Vite
        working-directory: ./frontend
        run: npm run build

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sincronizar Capacitor con Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Configurar licencias de Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Dar permisos de ejecución a gradlew
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar artefacto APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Ingeap-Inventario-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
