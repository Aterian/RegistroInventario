name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      crear_release:
        description: '¿Publicar tambien como Release descargable en GitHub?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar frontend Vite
        working-directory: ./frontend
        run: npm run build

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sincronizar Capacitor con Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Configurar licencias de Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Dar permisos de ejecucion a gradlew
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Preparar archivo APK final
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.3.0}"
          APK_NAME="Ingeap-Inventario-${VERSION}.apk"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./${APK_NAME}
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./Ingeap-Inventario.apk
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Publicar artefacto APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Ingeap-Inventario-APK
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publicar Release en GitHub (Descarga directa para celular)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.crear_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Ingeap Inventario Celular v1.3.0' }}
          body: |
            ### 📱 Ingeap Inventario para Celular (Android) - v1.3.0
            
            - **Novedades de esta versión:**
              - 🎨 **Ícono Oficial de Ingeap:** Ícono nativo adaptativo en alta resolución para el launcher del teléfono.
              - 📱 **Nuevo Menú Móvil Intuitivo:** Barra de navegación inferior ergonómica al alcance del pulgar (Inicio, Viajes, botón central destacado de Salida, Catálogo y menú Más).
              - 👥 **Listado de Proyectos y Usuarios:** Lectura directa y rápida desde las hojas `usuarios` y `proyectos_activos` de la planilla maestra.
              - 📷 **Corrección de Permisos de Cámara:** Acceso nativo habilitado en AndroidManifest para escaneo QR de herramientas e instrumental.
              - ✏️ **Edición de Salidas Registradas:** Permite corregir o agregar ítems en viajes activos sin perder firmas ni fechas de salida.
            
            **Instalación en celular:**
            1. Descarga el archivo APK adjunto abajo directamente en tu teléfono.
            2. Toca el archivo descargado para instalar o actualizar la aplicación.
          files: |
            ${{ env.APK_NAME }}
            Ingeap-Inventario.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
