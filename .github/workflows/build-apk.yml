name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      crear_release:
        description: '¿Publicar tambien como Release descargable en GitHub?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm install

      - name: Compilar frontend Vite
        working-directory: ./frontend
        run: npm run build

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sincronizar Capacitor con Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Configurar licencias de Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Dar permisos de ejecucion a gradlew
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Preparar archivo APK final
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk ./Ingeap-Inventario-v1.2.0.apk

      - name: Publicar artefacto APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: Ingeap-Inventario-APK
          path: Ingeap-Inventario-v1.2.0.apk
          retention-days: 30

      - name: Publicar Release en GitHub (Descarga directa para celular)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.crear_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0-mobile' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Ingeap Inventario Celular v1.2.0' }}
          body: |
            ### 📱 Ingeap Inventario para Celular (Android) - v1.2.0
            
            - **Novedades de esta versión:**
              - 🏠 **Menú Inicial:** Pantalla de bienvenida con accesos rápidos a todos los módulos.
              - 📷 **Lector QR Integrado:** Escaneo instantáneo de códigos de barras y QR con la cámara del teléfono en salidas.
              - 🏷️ **Etiquetas QR Imprimibles:** Generación de etiquetas en alta resolución y descarga de PDF para rotular equipos.
              - ⚠️ **Control de Mantenimiento:** Alertas visuales para instrumental en calibración/mantenimiento (sin bloqueo de salida).
              - ⏱️ **Costeo Inteligente:** Soporte de días de uso para adicionales (bastones, trípodes) e instrumental, km para movilidad, ciclos de batería y cantidad para materiales.
              - 📦 **Ajuste Directo de Stock:** Modificación directa de stock físico para materiales, indumentaria y herramientas.
              - 🛒 **Solicitudes de Compra:** Selector clasificado por Áreas Operativas y Empleados de Ingeap.
              - 🔧 **Kardex y Repuestos:** Selección de ítems de catálogo y asignación a equipos/vehículos de destino.
              - ☁️ **Conexión 24/7:** Opera de forma autónoma conectado a Google Cloud sin requerir la PC encendida.
            
            **Instalación:** Descarga el archivo adjunto `Ingeap-Inventario-v1.2.0.apk` directamente en tu celular y tócalo para actualizar.
          files: Ingeap-Inventario-v1.2.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
